<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ · สมุดสะสมแสตมป์</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="sparkle-field" id="sparkleField"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="mb-3">
        <img src="images/logo-bitwise.png" alt="Bitwise Group" class="login-logo">
      </div>
      <div class="eyebrow mb-1">Bitwise Group</div>
      <h1 class="brand-title mb-1" style="color:var(--royal-blue); text-shadow:none;">✨สมุดสะสมแสตมป์✨</h1>
      <p class="mb-4" style="color:var(--purple-deep); font-family:var(--font-heading); font-style:italic;">
        การผจญภัยแห่งความสำเร็จของคุณเริ่มต้นที่นี่
      </p>

      <div class="role-toggle btn-group mb-4" role="group">
        <button type="button" id="roleEmployeeBtn" class="btn btn-magic-gold px-4"><i class="fa-solid fa-user"></i> พนักงาน</button>
        <button type="button" id="roleManagerBtn" class="btn btn-magic-outline px-4"><i class="fa-solid fa-user-tie"></i> ผู้ดูแล / HR</button>
      </div>

      <div id="employeeAlertBox"></div>
      <form id="employeeLoginForm">
        <div class="mb-3 text-start">
          <label class="form-label fw-bold" style="color:var(--royal-blue)">รหัสพนักงาน</label>
          <input type="text" class="form-control form-control-magic" id="employeeIdInput" placeholder="เช่น 2380014" required>
        </div>
        <button type="submit" class="btn btn-magic-gold w-100 py-2"><i class="fa-solid fa-book-sparkles"></i> เปิดสมุดแสตมป์ของฉัน</button>
      </form>

      <div id="managerAlertBox"></div>
      <form id="managerLoginForm" class="d-none">
        <div class="mb-3 text-start">
          <label class="form-label fw-bold" style="color:var(--royal-blue)">รหัสผู้ดูแล (Manager/HR ID)</label>
          <input type="text" class="form-control form-control-magic" id="managerIdInput" placeholder="เช่น 1673231" required>
        </div>
        <div class="mb-3 text-start">
          <label class="form-label fw-bold" style="color:var(--royal-blue)">PIN</label>
          <input type="password" class="form-control form-control-magic" id="managerPinInput" placeholder="รหัส PIN 6 หลัก" required>
        </div>
        <button type="submit" class="btn btn-purple w-100 py-2"><i class="fa-solid fa-shield-halved"></i> เข้าสู่ระบบผู้ดูแล</button>
      </form>

      <p class="mt-4 mb-0 text-muted small">ระบบสมุดพกสะสมแสตมป์ดิจิตอลสำหรับพนักงาน</p>
    </div>
  </div>

  <script>
    const field = document.getElementById('sparkleField');
    for (let i = 0; i < 28; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 3) + 's';
      field.appendChild(s);
    }
  </script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
